<!DOCTYPE html>
<html>
<head>
  <title>🎮 Red Light, Green Light Music Controller</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Basic Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      min-height: 100vh;
      background: #1A1E24;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: background 0.25s, color 0.25s;
    }
    /* Mobile scrolling adjustments */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        overflow-y: auto;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
      .controller {
        margin: 1rem;
        padding: 1.5rem;
      }
      .timer-display {
        font-size: 2.5em;
      }
      .timer-input {
        width: 100px;
        font-size: 1em;
      }
      .shadow__btn {
        font-size: 15px;
        padding: 12px 20px;
      }
    }
    #container {
      position: fixed;
      inset: -1em;
      --c: 7px;
      background-color: #000;
      background-image: radial-gradient(circle at 50% 50%, #0000 1.5px, #000 0 var(--c), #0000 var(--c)),
        radial-gradient(circle at 50% 50%, #0000 1.5px, #000 0 var(--c), #0000 var(--c)),
        radial-gradient(circle at 50% 50%, #f00, #f000 60%),
        radial-gradient(circle at 50% 50%, #ff0, #ff00 60%),
        radial-gradient(circle at 50% 50%, #0f0, #0f00 60%),
        radial-gradient(ellipse at 50% 50%, #00f, #00f0 60%);
      background-size: 12px 20.7846097px,
        12px 20.7846097px,
        200% 200%,
        200% 200%,
        200% 200%,
        200% 20.7846097px;
      --p: 0px 0px, 6px 10.39230485px;
      background-position: var(--p),
        0% 0%,
        0% 0%,
        0% 0px;
      animation: wee 40s linear infinite,
        filt 6s linear infinite;
      opacity: 0.3;
      z-index: 0;
      transition: background 0.25s;
    }
    @keyframes filt {
      0% { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }
    @keyframes wee {
      0% {
        background-position: var(--p),
          800% 400%,
          1000% -400%,
          -1200% -600%,
          400% 41.5692194px;
      }
      to {
        background-position: var(--p),
          0% 0%,
          0% 0%,
          0% 0%,
          0% 0%;
      }
    }
    .controller {
      background: rgba(42, 47, 61, 0.95);
      padding: 2rem;
      border-radius: 15px;
      width: 90%;
      max-width: 800px;
      z-index: 1;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .title {
      color: #FF6B6B;
      text-align: center;
      font-size: 2em;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .timer-section {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
    .timer-display {
      font-size: 3.5em;
      font-weight: bold;
      color: #4CAF50;
      font-family: 'Courier New', monospace;
      margin: 1rem 0;
      transition: color 0.25s;
    }
    .timer-input {
      background: #3D4455;
      border: none;
      padding: 0.8rem;
      border-radius: 5px;
      color: white;
      font-size: 1.2em;
      width: 150px;
      text-align: center;
      margin-right: 10px;
    }
    .timer-notification {
      font-size: 1.2em;
      color: #FF6B6B;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 2rem 0;
    }
    @media (max-width: 500px) {
      .button-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .shadow__btn {
      padding: 15px 25px;
      border: none;
      font-size: 17px;
      color: #fff;
      border-radius: 7px;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      transition: 0.5s;
      transition-property: box-shadow;
      cursor: pointer;
      margin: 5px;
    }
    .btn-loop {
      background: rgb(0,140,255);
      box-shadow: 0 0 25px rgb(0,140,255);
    }
    .btn-red {
      background: #FF6B6B;
      box-shadow: 0 0 25px #FF6B6B;
    }
    .btn-green {
      background: #4CAF50;
      box-shadow: 0 0 25px #4CAF50;
    }
    .shadow__btn:hover {
      box-shadow: 0 0 5px currentColor,
                  0 0 25px currentColor,
                  0 0 50px currentColor,
                  0 0 100px currentColor;
    }
    .status {
      text-align: center;
      margin-top: 1rem;
      font-size: 1.2em;
      color: #4CAF50;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div class="controller">
    <h1 class="title">🎮 Red Light, Green Light Music Controller</h1>
    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <input type="number" class="timer-input" id="timerInput" placeholder="Seconds">
      <button class="shadow__btn btn-loop" onclick="startTimer()">Start Timer</button>
      <button class="shadow__btn btn-red" onclick="cancelTimer()">Cancel</button>
      <div class="timer-notification" id="timerNotification"></div>
    </div>
    <div class="button-grid">
      <!-- Button order: Red Light, Green Light, Loop Music, Pause, Stop, Logs -->
      <button class="shadow__btn btn-red" onclick="playTrack('B')">🔴 Red Light!</button>
      <button class="shadow__btn btn-green" onclick="playTrack('C')">🟢 Green Light</button>
      <button class="shadow__btn btn-loop" onclick="playTrack('A', -1)">🎶 Loop Music</button>
      <button class="shadow__btn btn-loop" onclick="togglePause()" id="pauseButton">⏸️ Pause</button>
      <button class="shadow__btn btn-loop" onclick="stopMusic()">⏹️ Stop</button>
      <button class="shadow__btn btn-loop" onclick="viewLogs()">📜 View Logs</button>
    </div>
    <div class="status" id="status">No Track Playing</div>
  </div>
  <script>
    // Define audio tracks and set volume to maximum
    const tracks = {
      'A': new Audio('t.mp3'),
      'B': new Audio('r.mp3'),
      'C': new Audio('g.mp3')
    };
    let currentVolume = 1; // maximum volume
    Object.values(tracks).forEach(audio => {
      audio.volume = currentVolume;
    });
    
    let currentTrack = null;
    let currentTrackKey = null;
    let isPaused = false;
    let timerInterval = null;
    let trackStartTime = 0;
    let totalPlayed = { 'A': 0, 'B': 0, 'C': 0 };
    // Log array for tracking play durations
    let logs = [];
    
    function logDuration(trackKey) {
      if (trackKey && trackStartTime) {
        const duration = (Date.now() - trackStartTime) / 1000;
        totalPlayed[trackKey] += duration;
        const logMessage = `Played ${trackKey} for ${duration.toFixed(2)} seconds (Total: ${totalPlayed[trackKey].toFixed(2)}s)`;
        logs.push(logMessage);
        console.log(logMessage);
      }
    }
    function playTrack(track, loop = 0) {
      if (currentTrack) {
        logDuration(currentTrackKey);
        currentTrack.pause();
        currentTrack.currentTime = 0;
      }
      currentTrackKey = track;
      currentTrack = tracks[track];
      trackStartTime = Date.now();
      currentTrack.loop = (loop === -1);
      currentTrack.play();
      updateStatus();
      if (track === 'B') {
        document.getElementById('timerDisplay').style.color = "#FF6B6B";
      } else if (track === 'C') {
        document.getElementById('timerDisplay').style.color = "#4CAF50";
      } else {
        document.getElementById('timerDisplay').style.color = "#4CAF50";
      }
    }
    function stopMusic() {
      if (currentTrack) {
        logDuration(currentTrackKey);
        currentTrack.pause();
        currentTrack.currentTime = 0;
      }
      currentTrack = null;
      currentTrackKey = null;
      isPaused = false;
      updateStatus();
      updatePauseButton();
    }
    function togglePause() {
      if (!currentTrack) return;
      if (isPaused) {
        currentTrack.play();
        trackStartTime = Date.now();
        isPaused = false;
      } else {
        logDuration(currentTrackKey);
        currentTrack.pause();
        isPaused = true;
      }
      updateStatus();
      updatePauseButton();
    }
    tracks['C'].addEventListener('ended', () => {
      logDuration('C');
      playTrack('A', -1);
    });
    function updatePauseButton() {
      const btn = document.getElementById('pauseButton');
      btn.textContent = isPaused ? "▶️ Resume" : "⏸️ Pause";
    }
    function updateStatus() {
      const status = document.getElementById('status');
      if (!currentTrackKey) {
        status.textContent = "No Track Playing";
      } else {
        status.textContent = `Current Track: ${currentTrackKey}${isPaused ? " (Paused)" : ""}`;
      }
    }
    let timerCancelFlag = false;
    function startTimer() {
      const seconds = parseInt(document.getElementById('timerInput').value);
      if (isNaN(seconds) || seconds <= 0) {
        alert("Please enter a valid time in seconds");
        return;
      }
      cancelTimer();
      playTrack('A', -1);
      let remaining = seconds;
      updateTimerDisplay(remaining);
      timerCancelFlag = false;
      document.getElementById('timerNotification').textContent = "";
      timerInterval = setInterval(() => {
        if (timerCancelFlag) {
          clearInterval(timerInterval);
          return;
        }
        remaining--;
        updateTimerDisplay(remaining);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerNotification').textContent = "Timer expired! Playing Red Light!";
          stopMusic();
          playTrack('B');
        }
      }, 1000);
    }
    function cancelTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerCancelFlag = true;
      updateTimerDisplay(0);
      document.getElementById('timerNotification').textContent = "";
      stopMusic(); // Now stops the track when Cancel is pressed.
    }
    function updateTimerDisplay(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remSeconds = seconds % 60;
      document.getElementById('timerDisplay').textContent =
        `${minutes.toString().padStart(2, '0')}:${remSeconds.toString().padStart(2, '0')}`;
    }
    function viewLogs() {
      if (logs.length === 0) {
        alert("No logs available.");
      } else {
        alert(logs.join("\n"));
      }
    }
  </script>
</body>
</html>
